<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBRO 表单提取器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    padding: 24px;
    color: #1a1a1a;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  .api-section { margin-bottom: 20px; }
  .api-section label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .api-section input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px;
  }

  .upload-area {
    border: 2px dashed #bbb;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafa;
  }
  .upload-area:hover { border-color: #4a90e2; background: #f0f7ff; }
  .upload-area.dragover { border-color: #4a90e2; background: #e8f2ff; }
  .upload-area p { color: #666; font-size: 14px; }
  .upload-area .icon { font-size: 40px; margin-bottom: 8px; }

  #preview {
    max-width: 100%; max-height: 400px; border-radius: 8px;
    margin-top: 16px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .btn {
    background: #4a90e2; color: #fff; border: none;
    padding: 12px 24px; border-radius: 8px; font-size: 15px;
    cursor: pointer; width: 100%; margin-top: 16px;
    transition: background 0.2s;
  }
  .btn:hover:not(:disabled) { background: #357abd; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }

  .btn-secondary {
    background: #28a745;
  }
  .btn-secondary:hover:not(:disabled) { background: #218838; }

  .status {
    margin-top: 12px; font-size: 14px; text-align: center;
    min-height: 20px;
  }
  .status.error { color: #d32f2f; }
  .status.success { color: #2e7d32; }
  .status.loading { color: #1976d2; }

  .json-section { display: none; }
  .json-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .json-header h2 { font-size: 18px; }
  pre {
    background: #1e1e1e; color: #d4d4d4; padding: 16px;
    border-radius: 8px; overflow-x: auto; font-size: 13px;
    line-height: 1.6; max-height: 500px; overflow-y: auto;
  }
  .json-key { color: #9cdcfe; }
  .json-string { color: #ce9178; }
  .json-null { color: #569cd6; }
</style>
</head>
<body>
<div class="container">
  <h1>📄 EBRO 表单提取器</h1>
  <p class="subtitle">上传表单图片，自动提取内容并生成 JSON</p>

  <!-- API Key 输入 -->
  <div class="card api-section">
    <label for="apiKey">Gemini API Key（仅本地保存，不会上传）</label>
    <input type="password" id="apiKey" placeholder="粘贴你的 Gemini API Key..." />
    <p style="font-size: 12px; color: #999; margin-top: 6px;">
      还没有？前往 <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a> 免费获取
    </p>
  </div>

  <!-- 上传区域 -->
  <div class="card">
    <div class="upload-area" id="uploadArea">
      <div class="icon">📤</div>
      <p>点击选择图片，或将图片拖拽到此处</p>
      <p style="font-size: 12px; color: #999; margin-top: 4px;">支持 JPG、PNG、WEBP</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" />
    <img id="preview" alt="预览" />

    <button class="btn" id="extractBtn" disabled>开始提取</button>
    <div class="status" id="status"></div>
  </div>

  <!-- JSON 结果 -->
  <div class="card json-section" id="jsonSection">
    <div class="json-header">
      <h2>✅ 提取结果</h2>
      <button class="btn btn-secondary" id="downloadBtn" style="width: auto; margin: 0;">
        ⬇️ 下载 JSON
      </button>
    </div>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<script>
  const API_KEY_STORAGE = 'gemini_api_key';

  const apiKeyInput = document.getElementById('apiKey');
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const extractBtn = document.getElementById('extractBtn');
  const statusEl = document.getElementById('status');
  const jsonSection = document.getElementById('jsonSection');
  const jsonOutput = document.getElementById('jsonOutput');
  const downloadBtn = document.getElementById('downloadBtn');

  let currentFile = null;
  let currentJson = null;

  // 恢复已保存的 API Key
  const savedKey = localStorage.getItem(API_KEY_STORAGE);
  if (savedKey) apiKeyInput.value = savedKey;

  apiKeyInput.addEventListener('input', () => {
    localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
    updateButtonState();
  });

  // 点击上传
  uploadArea.addEventListener('click', () => fileInput.click());

  // 拖拽上传
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) {
      showStatus('请选择图片文件', 'error');
      return;
    }
    currentFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = 'block';
      updateButtonState();
      showStatus('');
    };
    reader.readAsDataURL(file);
  }

  function updateButtonState() {
    extractBtn.disabled = !currentFile || !apiKeyInput.value.trim();
  }

  function showStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + type;
  }

  // 提取按钮
  extractBtn.addEventListener('click', async () => {
    if (!currentFile || !apiKeyInput.value.trim()) return;

    extractBtn.disabled = true;
    showStatus('⏳ 正在调用 Gemini 提取中...', 'loading');
    jsonSection.style.display = 'none';

    try {
      // 读取图片为 base64
      const base64 = await fileToBase64(currentFile);
      const mimeType = currentFile.type;

      const prompt = `你是一个数据提取助手。请从这张 EBRO Factory "Control Calidad" 表单图片中提取所有信息。
返回一个有效的 JSON 对象，结构如下。如果字段为空或无法识别，使用 null。

{
  "header": {
    "company": "string",
    "document_type": "string",
    "red_number": "string"
  },
  "section_1": {
    "codigo_conjunto": "string",
    "codigo_componente": "string",
    "codigo_rechaz": "string",
    "cantidad": "string",
    "origen_area_zona": "string"
  },
  "section_2": {
    "motivo_rechace": "string",
    "fecha": "string",
    "observaciones": "string",
    "operario": "string"
  },
  "signatures": {
    "inspector": "string",
    "visto_bueno_calidad": "string",
    "encargado_linea": "string"
  }
}`;

      const apiKey = apiKeyInput.value.trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: mimeType, data: base64 } }
            ]
          }],
          generationConfig: {
            responseMimeType: 'application/json',
            maxOutputTokens: 2000
          }
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) throw new Error('Gemini 未返回有效内容');

      // 清理并解析 JSON
      let cleaned = text.trim()
        .replace(/^```json\s*/i, '')
        .replace(/^```\s*/i, '')
        .replace(/\s*```$/, '');

      currentJson = JSON.parse(cleaned);

      jsonOutput.innerHTML = syntaxHighlight(currentJson);
      jsonSection.style.display = 'block';
      showStatus('✅ 提取成功！', 'success');

    } catch (err) {
      console.error(err);
      showStatus('❌ 出错：' + err.message, 'error');
    } finally {
      extractBtn.disabled = false;
    }
  });

  // 文件转 base64
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // JSON 语法高亮
  function syntaxHighlight(obj) {
    let json = JSON.stringify(obj, null, 2);
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      (match) => {
        let cls = 'json-string';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) cls = 'json-key';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return `<span class="${cls}">${match}</span>`;
      }
    );
  }

  // 下载 JSON 文件
  downloadBtn.addEventListener('click', () => {
    if (!currentJson) return;
    const blob = new Blob([JSON.stringify(currentJson, null, 2)], {
      type: 'application/json'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.href = url;
    a.download = `ebro-extract-${timestamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
